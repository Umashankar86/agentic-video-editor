services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      MEDIA_ROOT: /data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-xingchen-agi/xing4.0-29b-a4b:free,dots-studio/dots-3-note-preview:free,openrouter/free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:8080}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Agentic Video Editor}
      BLIP_MODEL: ${BLIP_MODEL:-Salesforce/blip-image-captioning-base}
      FRAME_SAMPLE_SECONDS: ${FRAME_SAMPLE_SECONDS:-30}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      FFMPEG_SKILL_MCP_SERVER: /app/vendor/ffmpeg-skill/mcp/server.py
      FFMPEG_SKILL_TIMEOUT_SECONDS: ${FFMPEG_SKILL_TIMEOUT_SECONDS:-600}
      FFMPEG_SKILL_PYTHON: ${FFMPEG_SKILL_PYTHON:-python3}
    volumes:
      - ./uploads:/data/uploads
      - ./work:/data/work
      - ./outputs:/data/outputs
      - ./assets/music:/data/assets/music:ro
      - model-cache:/root/.cache
    ports:
      - "8000:8000"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    depends_on:
      - worker
    environment:
      PORT: 8080
      MEDIA_ROOT: /data
      WORKER_URL: http://worker:8000
      JOB_WORKERS: 2
      JOB_QUEUE_SIZE: 100
    volumes:
      - ./uploads:/data/uploads
      - ./work:/data/work
      - ./outputs:/data/outputs
    ports:
      - "8080:8080"

volumes:
  model-cache:

